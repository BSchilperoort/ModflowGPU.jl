name: Run tests

# CPU tests only. GPU tests run only on the development machine (see CLAUDE.md).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.version }}, KA ${{ matrix.ka }} (CPU)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12', '1']
        # KA 0.10 (CPU backend is POCL) and KA 0.9 (native Julia CPU backend; the version
        # mGV allows, so the Milestone B environment uses it)
        ka: ['0.10', '0.9']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Restrict KernelAbstractions to ${{ matrix.ka }}
        run: julia --project=test -e 'using Pkg; Pkg.compat("KernelAbstractions", "${{ matrix.ka }}"); Pkg.resolve()'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
